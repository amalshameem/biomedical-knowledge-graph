services:
  neo4j:
    image: neo4j:5.18.0-community
    container_name: biomed_neo4j
    ports:
      - "7474:7474" # Neo4j Browser Web UI
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - neo4j_data:/data
    networks:
      - biomed_network

  postgres:
    image: postgres:16-alpine
    container_name: biomed_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=biomed
      - POSTGRES_PASSWORD=biomed_password
      - POSTGRES_DB=biomed_kg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biomed -d biomed_kg"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - biomed_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biomed_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://biomed:biomed_password@postgres:5432/biomed_kg
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface
    networks:
      - biomed_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biomed_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - biomed_network

volumes:
  neo4j_data:
  postgres_data:
  hf_cache:

networks:
  biomed_network:
    driver: bridge
